# Checks a change on a development branch: the Lean proofs (lake build checks every theorem), the
# WebAssembly engine, the Rust oracle, the type check, the unit tests, and Exegra's own specification
# (validate and traceability). It publishes nothing; .github/workflows/pages.yml publishes main.

name: Check

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# Logs go to $RUNNER_TEMP, never into the checkout: the tree stamp that binds recorded results covers
# untracked files, so a log written between verify and generate would make every result read as stale.
permissions:
  # contents: write lets the last step commit regenerated artifacts back to the development branch.
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Same key as the Pages workflow, so a branch restores what main built.
      - name: Cache the Lean toolchain and the WebAssembly build inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            ~/.cache/exegra/formal-wasm
            formal/.lake
          key: formal-wasm-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml', 'formal/lake-manifest.json', 'tools/build-formal-wasm.js', 'formal/wasm/**') }}-${{ hashFiles('formal/**/*.lean') }}
          restore-keys: |
            formal-wasm-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.toml', 'formal/lake-manifest.json', 'tools/build-formal-wasm.js', 'formal/wasm/**') }}-

      - name: Cache the Rust oracle build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            engine/target
          key: rust-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock', 'engine/**/Cargo.toml') }}-${{ hashFiles('engine/**/*.rs') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock', 'engine/**/Cargo.toml') }}-

      - run: npm ci

      - name: Check the Lean proofs and build the Lean core to WebAssembly
        run: node tools/build-formal-wasm.js --jobs 4

      - name: Build the Rust oracle (WebAssembly and the native exegra-sim)
        run: |
          rustup target add wasm32-unknown-unknown
          want=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)"/\1/p' engine/exegra-engine-wasm/Cargo.toml)
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$want"; then cargo install wasm-bindgen-cli --version "$want" --locked --force; fi
          node tools/build-engine.js
          (cd engine && cargo build --release -p exegra-engine --bin exegra-sim)

      - name: Validate Exegra's own specification
        run: node cli/exegra.js validate --project exegra --pretty

      - name: Traceability (no missing modules, no unclaimed files)
        run: |
          node cli/exegra.js traceability --project exegra > "$RUNNER_TEMP/traceability.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/traceability.json','utf8')).result;const m=r.missingModules??[],u=r.unclaimedFiles??[];console.log(JSON.stringify({missingModules:m,unclaimedFiles:u},null,2));process.exit(m.length||u.length?1:0)"

      - name: Type check
        if: always()
        run: npx tsc -p jsconfig.json --noEmit

      # The full spec-reporter output is kept as a file; the log shows the failures and the summary.
      - name: Unit tests
        if: always()
        run: |
          set +e
          node tools/run-unit-tests.js > "$RUNNER_TEMP/unit-tests.log" 2>&1
          status=$?
          grep -n -A40 -E '^\s*(✖|not ok)' "$RUNNER_TEMP/unit-tests.log" | head -600
          tail -25 "$RUNNER_TEMP/unit-tests.log"
          exit $status

      # Executes the evidence (unit and browser tests), checks the lean-theorem claims with Lean, records
      # the results with their provenance stamps in specs/exegra/evidence/results.json and re-evaluates
      # every claim (AGENTS.md, done criterion 3). The browser tests use the runner's installed Chrome.
      - name: Verify Exegra against its own specification
        if: always()
        run: |
          set +e
          node cli/exegra.js verify --project exegra --expect-violated edits-only-via-transactions,core-logic-in-lean --pretty > "$RUNNER_TEMP/verify.json" 2> "$RUNNER_TEMP/verify.log"
          status=$?
          tail -40 "$RUNNER_TEMP/verify.log"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/verify.json','utf8'));const x=r.result??r;console.log(JSON.stringify({ok:r.ok,error:r.error,summary:x.summary??x.claims?.summary,violated:x.violated,regressions:x.regressions},null,2))" || head -c 4000 "$RUNNER_TEMP/verify.json"
          exit $status

      # npm run generate cannot run where the Lean toolchain is not installed, so a development branch
      # gets its derived artifacts rewritten and committed here (a push made with the workflow token starts no new run).
      - name: Regenerate the derived artifacts and commit the recorded results
        if: always()
        run: |
          node cli/exegra.js generate --write --project exegra > /dev/null
          git diff --stat -- specs/exegra/generated specs/exegra/evidence
          if ! git diff --quiet -- specs/exegra/generated specs/exegra/evidence; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add specs/exegra/generated specs/exegra/evidence
            git commit -m "Record verification results and regenerate the derived artifacts of Exegra's specification"
            git push origin HEAD:${{ github.ref_name }}
          fi
